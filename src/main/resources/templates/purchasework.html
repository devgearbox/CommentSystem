<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>采购工作台</title>
    <style>
        /* 只保留内容区域的样式 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .user-info {
            display: flex;
            align-items: center;
        }

        .user-info img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* 其他内容样式... */
    </style>
</head>
<body>
<div class="header">
    <h2>采购人员工作台</h2>
    <div class="user-info">
        <img th:src="@{/img/defaultMan.png}" alt="用户头像">
        <div>
            <div th:text="${session.username}" style="font-size: 30px"></div>
            <div style="font-size: 12px; color: #666; text-align: center;">采购专员</div>
        </div>
    </div>
</div>

<div class="stats-container">
    <div class="stat-card">
        <div class="title">待审批订单</div>
        <div class="value">5</div>
        <div class="trend up">
            <i class="fas fa-arrow-up"></i> 较昨日 +2
        </div>
    </div>
    <div class="stat-card">
        <div class="title">今日新增订单</div>
        <div class="value">3</div>
        <div class="trend down">
            <i class="fas fa-arrow-down"></i> 较昨日 -1
        </div>
    </div>
    <div class="stat-card">
        <div class="title">本月采购总量(kg)</div>
        <div class="value">1250</div>
        <div class="trend up">
            <i class="fas fa-arrow-up"></i> 较上月 +320
        </div>
    </div>
    <div class="stat-card">
        <div class="title">活跃供应商</div>
        <div class="value">8</div>
        <div class="trend">与昨日持平</div>
    </div>
</div>

<!-- 其他内容区域... -->
</body>
</html>
