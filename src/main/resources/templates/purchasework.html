<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荔枝批发管理系统 - 采购人员端</title>
    <link rel="stylesheet" th:href="@{/css/font-awesome/beta3/all.min.css}">
    <script th:src="@{/js/jquery/jquery-3.6.0.min.js}"></script>
    <link rel="stylesheet" href="/css/purchasework.css">
</head>
<body>
<div class="sidebar">
    <div class="logo">
        <!-- 替换为荔枝图标 -->
        <i class="fas fa-leaf" style="font-size: 24px;"></i>
        <h1>荔枝批发管理系统</h1>
    </div>
    <div class="menu">
        <div class="menu-item active" data-url="/work">
            <i class="fas fa-tachometer-alt"></i>
            <span>采购工作台</span>
        </div>
        <div class="menu-item" data-url="/orders">
            <i class="fas fa-file-alt"></i>
            <span>采购订单</span>
        </div>
        <div class="menu-item" data-url="/stock">
            <i class="fas fa-truck"></i>
            <span>荔枝入库</span>
        </div>
        <div class="menu-item" data-url="/suppliers" th:if="${session.currentUser.role != 2}">
            <i class="fas fa-users"></i>
            <span>供应商</span>
        </div>
        <div class="menu-item" data-url="/analyse" th:if="${session.currentUser.role != 3}">
            <i class="fas fa-chart-bar"></i>
            <span>采购统计分析</span>
        </div>
        <div class="menu-item" data-url="/settings">
            <i class="fas fa-cog"></i>
            <span>个人设置</span>
        </div>
        <div class="menu-item" data-url="/feedback">
            <i class="fas fa-comments"></i>
            <span>反馈</span>
        </div>
        <div class="menu-item" data-url="/help">
            <i class="fas fa-question-circle"></i>
            <span>帮助</span>
        </div>
        <div class="menu-item" data-url="/introduction">
            <i class="fas fa-info-circle"></i>
            <span>功能介绍</span>
        </div>
        <div class="menu-item version-item" style="pointer-events: none; cursor: default; user-select: none;">
            <span>当前版本 V 1.1.1.0</span>
        </div>
        <div class="menu-item logout-item" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i>
            <span>退出登录</span>
        </div>
    </div>
</div>

<div class="main-content">
    <!-- 使用iframe加载不同页面 -->
    <iframe id="content-frame" src="/work" style="width: 100%; min-height: 800px; border: none;"></iframe>
</div>

<script>
    $(function() {
    // 获取 URL 中的 target 参数
    const urlParams = new URLSearchParams(window.location.search);
    const target = urlParams.get('target') || '/work';

    // 设置 iframe 初始地址
    $('#content-frame').attr('src', target);

    // 同步激活对应菜单
    $('.menu-item').each(function() {
        if ($(this).attr('data-url') === target) {
            $(this).addClass('active');
        }
    });
});
// 1. 初始化时，先给iframe设置固定高度（充满视口，减去侧边栏/导航栏高度）
$(function() {
  // 计算视口高度 - 20px（避免边缘溢出），可根据实际布局调整数值
  const viewportHeight = $(window).height() - 20;
  $('#content-frame').height(viewportHeight);
});

// 2. 点击菜单加载页面时，重置iframe高度（防止页面切换后高度异常）
$('.menu-item').click(function() {
  var url = $(this).attr('data-url');
  $('#content-frame').attr('src', url);

  // 重置iframe高度为视口高度
  const viewportHeight = $(window).height() - 20;
  $('#content-frame').height(viewportHeight);

  $('.menu-item').removeClass('active');
  $(this).addClass('active');
  history.pushState(null, null, url);
});

    //侧边栏颜色跟随
    window.addEventListener('popstate', function() {
        var currentUrl = window.location.pathname;
        // 根据当前 URL 找到对应的菜单项并设置选中状态
        $('.menu-item').each(function() {
            if ($(this).attr('data-url') === currentUrl) {
                $('.menu-item').removeClass('active');
                $(this).addClass('active');
                $('#content-frame').attr('src', currentUrl);
                return false;
            }
        });
    });
    // 处理浏览器前进/后退按钮
    // window.addEventListener('popstate', function() {
    //     var url = location.pathname;
    //     $('#content-frame').attr('src', url);
    // });
    function logout() {
        // 跳转到登录页面（替换为你的实际登录页 URL）
        window.location.href = "http://localhost:8080/login";

        // 可选：清除登录状态（如 Cookie、SessionStorage 等）
        // 示例：清除 SessionStorage
        sessionStorage.clear();
        // 示例：清除 Cookie（需根据实际情况实现）
        document.cookie = "token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    }
</script>
</body>
</html>
