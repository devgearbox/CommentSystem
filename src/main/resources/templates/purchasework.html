<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荔枝批发管理系统 - 采购人员端</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 220px;
            background-color: #2d8659;
            color: white;
            padding: 20px 0;
            height: 100vh;
            position: fixed;
        }

        .sidebar .logo {
            text-align: center;
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar .logo h1 {
            font-size: 18px;
            margin-top: 10px;
        }

        .sidebar .menu {
            margin-top: 30px;
        }

        .sidebar .menu-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .sidebar .menu-item:hover, .sidebar .menu-item.active {
            background-color: #236b45;
        }

        .sidebar .menu-item i {
            margin-right: 10px;
            font-size: 18px;
        }

        .main-content {
            flex: 1;
            margin-left: 220px;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .user-info {
            display: flex;
            align-items: center;
        }

        .user-info img {
            width:  60px;
            height: 60px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .stat-card .title {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #2d8659;
        }

        .stat-card .trend {
            margin-top: 10px;
            font-size: 13px;
        }

        .trend.up {
            color: #28a745;
        }

        .trend.down {
            color: #dc3545;
        }

        .section {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 20px;
            margin-bottom: 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h2 {
            font-size: 18px;
            color: #333;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background-color: #2d8659;
            color: white;
        }

        .btn-primary:hover {
            background-color: #236b45;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f9faf9;
            font-weight: bold;
            color: #555;
        }

        .status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background-color: #d4edda;
            color: #155724;
        }

        .status-rejected {
            background-color: #f8d7da;
            color: #721c24;
        }

        .action-btn {
            color: #2d8659;
            background: none;
            border: none;
            cursor: pointer;
            margin-right: 10px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: white;
            width: 500px;
            border-radius: 8px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 18px;
            margin: 0;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="logo">
        <!-- 替换为荔枝图标 -->
        <i class="fas fa-leaf" style="font-size: 24px;"></i>
        <h1>荔枝批发管理系统</h1>
    </div>
    <div class="menu">
        <div class="menu-item active" data-url="/work">
            <i class="fas fa-tachometer-alt"></i>
            <span>采购工作台</span>
        </div>
        <div class="menu-item" data-url="/orders">
            <i class="fas fa-file-alt"></i>
            <span>采购订单管理</span>
        </div>
        <div class="menu-item" data-url="/inventory">
            <i class="fas fa-truck"></i>
            <span>入库管理</span>
        </div>
        <div class="menu-item" data-url="/dashboard/suppliers">
            <i class="fas fa-users"></i>
            <span>供应商管理</span>
        </div>
        <div class="menu-item" data-url="/analysis">
            <i class="fas fa-chart-bar"></i>
            <span>采购统计分析</span>
        </div>
        <div class="menu-item" data-url="/settings">
            <i class="fas fa-cog"></i>
            <span>个人设置</span>
        </div>
    </div>
</div>

<div class="main-content">
    <!-- 使用iframe加载不同页面 -->
    <iframe id="content-frame" src="/work" style="width: 100%; height: 800px; border: none;"></iframe>
</div>

<script>
    // 点击菜单项加载对应页面到iframe
    $('.menu-item').click(function() {
        var url = $(this).attr('data-url');
        $('#content-frame').attr('src', url);

        // 更新URL（可选）
        history.pushState(null, null, url);
    });

    // 处理浏览器前进/后退按钮
    // window.addEventListener('popstate', function() {
    //     var url = location.pathname;
    //     $('#content-frame').attr('src', url);
    // });
</script>
</body>
</html>
