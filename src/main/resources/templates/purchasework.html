<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荔枝批发管理系统 - 采购人员端</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="/css/purchasework.css">
</head>
<body>
<div class="sidebar">
    <div class="logo">
        <!-- 替换为荔枝图标 -->
        <i class="fas fa-leaf" style="font-size: 24px;"></i>
        <h1>荔枝批发管理系统</h1>
    </div>
    <div class="menu">
        <div class="menu-item active" data-url="/work">
            <i class="fas fa-tachometer-alt"></i>
            <span>采购工作台</span>
        </div>
        <div class="menu-item" data-url="/orders">
            <i class="fas fa-file-alt"></i>
            <span>采购订单管理</span>
        </div>
        <div class="menu-item" data-url="/inventory">
            <i class="fas fa-truck"></i>
            <span>入库管理</span>
        </div>
        <div class="menu-item" data-url="/suppliers">
            <i class="fas fa-users"></i>
            <span>供应商管理</span>
        </div>
        <div class="menu-item" data-url="/analysis">
            <i class="fas fa-chart-bar"></i>
            <span>采购统计分析</span>
        </div>
        <div class="menu-item" data-url="/settings">
            <i class="fas fa-cog"></i>
            <span>个人设置</span>
        </div>
        <div class="menu-item" data-url="/feedback">
            <i class="fas fa-comments"></i>
            <span>反馈</span>
        </div>
        <div class="menu-item" data-url="/help">
            <i class="fas fa-question-circle"></i>
            <span>帮助</span>
        </div>
        <div class="menu-item" data-url="/introduction">
            <i class="fas fa-info-circle"></i>
            <span>功能介绍</span>
        </div>
        <div class="menu-item version-item" style="pointer-events: none; cursor: default; user-select: none;">
            <span>当前版本 V 1.1.1.0</span>
        </div>
        <div class="menu-item logout-item" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i>
            <span>退出登录</span>
        </div>
    </div>
</div>

<div class="main-content">
    <!-- 使用iframe加载不同页面 -->
    <iframe id="content-frame" src="/work" style="width: 100%; height: 800px; border: none;"></iframe>
</div>

<script>
    // 点击菜单项加载对应页面到iframe
    $('.menu-item').click(function() {
        var url = $(this).attr('data-url');
        $('#content-frame').attr('src', url);

        // 移除所有菜单项的 active 类
        $('.menu-item').removeClass('active');
        // 为当前点击的菜单项添加 active 类
        $(this).addClass('active');

        // 更新URL（可选）
        history.pushState(null, null, url);
    });

    //侧边栏颜色跟随
    window.addEventListener('popstate', function() {
        var currentUrl = window.location.pathname;
        // 根据当前 URL 找到对应的菜单项并设置选中状态
        $('.menu-item').each(function() {
            if ($(this).attr('data-url') === currentUrl) {
                $('.menu-item').removeClass('active');
                $(this).addClass('active');
                $('#content-frame').attr('src', currentUrl);
                return false;
            }
        });
    });
    // 处理浏览器前进/后退按钮
    // window.addEventListener('popstate', function() {
    //     var url = location.pathname;
    //     $('#content-frame').attr('src', url);
    // });
    function logout() {
        // 跳转到登录页面（替换为你的实际登录页 URL）
        window.location.href = "http://localhost:8080/login";

        // 可选：清除登录状态（如 Cookie、SessionStorage 等）
        // 示例：清除 SessionStorage
        sessionStorage.clear();
        // 示例：清除 Cookie（需根据实际情况实现）
        document.cookie = "token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    }
</script>
</body>
</html>
