<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>采购订单管理</title>
    <link rel="stylesheet" th:href="@{/css/supplier.css}">
    <style>
        /* 添加支付链接样式 */
        .pay-link {
            color: #1890ff;
            cursor: pointer;
            text-decoration: underline;
            font-weight: 500;
        }
        .pay-link:hover {
            color: #40a9ff;
            text-decoration: none;
        }

        .status-paid { color: #52c41a; }
    </style>
</head>
<body>
<div class="section">
    <div class="card-header">
        <h2>订单管理</h2>
    </div>

    <div class="header">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="输入订单编号...">
            <button id="search-button">搜索</button>
        </div>
        <button id="confirm-delete-order" style="display: none;" class="view-del">确认删除</button>
        <button id="cancel-delete-order" style="display: none;" class="view-all">取消</button>
        <button id="del-order" class="view-del" th:if="${session.currentUser.role == 1}">删除订单记录</button>
        <button class="view-all" id="search-all">查看全部</button>
    </div>

    <table>
        <thead>
        <tr>
            <th style="display: none">
                <input type="checkbox" id="select-all-order">
            </th>
            <th>采购人员</th>
            <th>供应商</th>
            <th>荔枝品种</th>
            <th>荔枝规格</th>
            <th>数量(斤）</th>
            <th>总价</th>
            <th>下单日期</th>
            <th>状态</th>
            <th><div class="action-header">操作</div></th>
        </tr>
        </thead>
        <tbody id="order-table-body">
        <!--  Thymeleaf 渲染逻辑 -->
        <tr th:each="order : ${purchaseOrders}" th:fragment="orderRow">
            <td style="display: none">
                <input type="checkbox" class="order-check" th:data-id="${order.order_id}">
            </td>
            <td th:text="${order.user.username}"></td>
            <td th:text="${order.supplier.supplier_name}"></td>
            <td th:text="${order.purchase_variety}"></td>
            <td th:text="${order.specification}"></td>
            <td th:text="${order.purchase_quantity}"></td>
            <td th:text="${order.totalPrice}"></td>
            <td th:text="${#dates.format(order.createTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td>
                <!-- 为未支付状态添加支付链接 -->
                <span th:if="${order.orderStatus.name() == 'pending'}"
                      class="pay-link"
                      th:data-order-id="${order.order_id}"
                      th:data-total-amount="${order.totalPrice}"
                      th:text="${order.orderStatus.label}">
                </span>
                <!-- 其他状态正常显示 -->
                <span th:unless="${order.orderStatus.name() == 'pending'}"
                      th:classappend="'status-' + ${order.orderStatus.name()}"
                      th:text="${order.orderStatus.label}">
                </span>
            </td>
            <td>
                <button class="view-btn" th:data-id="${order.order_id}">查看详情</button>
                <button class="status-btn"
                        th:data-id="${order.order_id}"
                        th:data-status="${order.orderStatus}"
                th:disabled="${order.orderStatus == T(com.example.lizhi.entity.PurchaseOrder.OrderStatus).received
                || order.orderStatus == T(com.example.lizhi.entity.PurchaseOrder.OrderStatus).rejected}" th:if="${session.currentUser.role != 2}">
                修改状态
                </button>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="pagination-container">
        <div class="pagination-info">
            共 <span th:text="${totalItems}">0</span> 条记录，
            第 <span th:text="${currentPage}">1</span> 页 / 共 <span th:text="${totalPages}">1</span> 页
        </div>

        <div class="pagination-controls">
            <!-- 首页 -->
            <button th:if="${currentPage > 1}"
                    onclick="goToPage(1)"
                    class="page-btn first-page">首页</button>

            <!-- 上一页 -->
            <button th:if="${currentPage > 1}"
                    th:onclick="'goToPage(' + (${currentPage - 1}) + ')'"
                    class="page-btn prev-page">上一页</button>

            <!-- 页码 -->
            <span th:each="page : ${#numbers.sequence(1, totalPages)}">
        <button th:if="${(page >= currentPage - 2) and (page <= currentPage + 2)}"
                th:classappend="${page == currentPage} ? 'active' : ''"
                th:onclick="'goToPage(' + ${page} + ')'"
                class="page-btn">
            [[${page}]]
        </button>
    </span>

            <!-- 下一页 -->
            <button th:if="${currentPage < totalPages}"
                    th:onclick="'goToPage(' + (${currentPage + 1}) + ')'"
                    class="page-btn next-page">下一页</button>

            <!-- 末页 -->
            <button th:if="${currentPage < totalPages}"
                    th:onclick="'goToPage(' + ${totalPages} + ')'"
                    class="page-btn last-page">末页</button>

            <!-- 页面大小选择 -->
            <select onchange="changePageSize(this.value)" class="page-size-select">
                <option value="5" th:selected="${pageSize == 5}">5条/页</option>
                <option value="10" th:selected="${pageSize == 10}">10条/页</option>
                <option value="20" th:selected="${pageSize == 20}">20条/页</option>
                <option value="50" th:selected="${pageSize == 50}">50条/页</option>
            </select>
        </div>
    </div>

    <!-- 新增状态修改弹窗 -->
    <div id="status-modal" class="modal">
        <div class="modal-content">
            <span class="close status-close">&times;</span>
            <h2>修改订单状态</h2>
            <form id="status-form">
                <input type="hidden" name="orderId" id="status-order-id">
                <div class="form-group-status">
                    <label>当前状态：</label>
                    <span id="current-status" class="current-status-text"></span>
                </div>
                <div class="form-group-status">
                    <label>修改为：</label>
                    <select name="newStatus" id="new-status" class="status-select" required>
                    </select>
                </div>

                <div class="form-group submit-group">
                    <button type="submit" class="submit-btn">确认修改</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div id="order-view-modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>订单详情</h2>
            <input type="hidden" id="current-order-id">
            <p>订单编号：<span id="order-no"></span></p>
            <p>采购人：<span id="order-real-name"></span></p>
            <p>采购人电话：<span id="order-user-phone"></span></p>
            <p>采购单价：<span id="order-price"></span></p>
            <p>数量：<span id="order-quantity"></span> 斤</p>
            <p>荔枝品种：<span id="order-variety"></span></p>
            <p>荔枝规格：<span id="order-specification"></span></p>
            <p>订单总价：<span id="order-total-price"></span></p>
            <p>供应商：<span id="order-supplier-name"></span></p>
            <p>供应商电话：<span id="order-supplier-phone"></span></p>
            <p>供应商地址：<span id="order-supplier-address"></span></p>
            <p>订单状态：<span id="order-status"></span></p>
            <p>下单日期：<span id="order-date"></span></p>
        </div>
    </div>

    <!-- 新增订单弹窗 -->
    <div id="add-modal" class="modal">
        <div class="modal-content">
            <span class="close" id="add-modal-close">&times;</span>
            <h2>新增采购订单</h2>
            <form id="add-form">
                <div class="form-group">
                    <label>采购人员ID：</label>
                    <input type="number" name="buyer_id" required>
                </div>
                <div class="form-group">
                    <label>供应商ID：</label>
                    <input type="number" name="supplier_id" required>
                </div>
                <div class="form-group">
                    <label>采购品种：</label>
                    <input type="text" name="product_variety" required>
                </div>
                <div class="form-group">
                    <label>单价：</label>
                    <input type="number" step="0.01" name="unit_price" required>
                </div>
                <div class="form-group">
                    <label>数量：</label>
                    <input type="number" min="1" name="quantity" required>
                </div>
                <div class="form-group submit-group">
                    <button type="submit" class="submit-btn">提交</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 编辑订单弹窗 -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span class="close edit-close">&times;</span>
            <h2>编辑采购订单</h2>
            <form id="edit-form">
                <input type="hidden" name="id" id="edit-id">
                <div class="form-group">
                    <label>订单编号：</label>
                    <input type="text" name="order_no" id="edit-no" readonly>
                </div>
                <div class="form-group">
                    <label>采购人员ID：</label>
                    <input type="number" name="buyer_id" id="edit-buyer-id" required>
                </div>
                <div class="form-group">
                    <label>供应商ID：</label>
                    <input type="number" name="supplier_id" id="edit-supplier-id" required>
                </div>
                <div class="form-group">
                    <label>采购品种：</label>
                    <input type="text" name="product_variety" id="edit-variety" required>
                </div>
                <div class="form-group">
                    <label>单价：</label>
                    <input type="number" step="0.01" name="unit_price" id="edit-price" required>
                </div>
                <div class="form-group">
                    <label>数量：</label>
                    <input type="number" min="1" name="quantity" id="edit-quantity" required>
                </div>
                <div class="form-group">
                    <label>总金额：</label>
                    <input type="number" step="0.01" name="total_amount" id="edit-total" readonly>
                </div>
                <div class="form-group">
                    <label>下单日期：</label>
                    <input type="text" name="order_date" id="edit-date" required>
                </div>
                <div class="form-group">
                    <label>状态：</label>
                    <select name="status" id="edit-status" required>
                        <option value="0">待审批</option>
                        <option value="1">已审批</option>
                        <option value="2">已发货</option>
                        <option value="3">已入库</option>
                        <option value="4">已取消</option>
                    </select>
                </div>
                <div class="form-group submit-group">
                    <button type="submit" class="submit-btn">保存修改</button>
                </div>
            </form>
        </div>
    </div>
    <!-- 支付确认弹窗 -->
    <div id="payment-confirm-modal" class="modal">
        <div class="modal-content">
            <span class="close" id="payment-close">&times;</span>
            <h2>确认支付</h2>
            <div class="payment-info">
                <p>订单号: <span id="payment-order-id"></span></p>
                <p>支付金额: ¥<span id="payment-amount"></span></p>
                <p>商品: <span id="payment-product">荔枝批发订单</span></p>
            </div>
            <div class="modal-actions">
                <button id="confirm-payment" class="btn-primary">立即支付</button>
                <button id="cancel-payment" class="btn-secondary">取消</button>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/order.js}"></script>
<script>
    // 分页功能
    function goToPage(page) {
        const urlParams = new URLSearchParams(window.location.search);
        urlParams.set('page', page);
        window.location.href = window.location.pathname + '?' + urlParams.toString();
    }

    function changePageSize(size) {
        const urlParams = new URLSearchParams(window.location.search);
        urlParams.set('size', size);
        urlParams.set('page', '1'); // 重置到第一页
        window.location.href = window.location.pathname + '?' + urlParams.toString();
    }
        // 支付功能
    document.addEventListener('DOMContentLoaded', function() {
        const paymentModal = document.getElementById('payment-confirm-modal');
        const paymentClose = document.getElementById('payment-close');
        const cancelPayment = document.getElementById('cancel-payment');
        const confirmPayment = document.getElementById('confirm-payment');

        let currentOrderId = '';
        let currentAmount = '';

        // 点击支付链接
        document.addEventListener('click', function(event) {
            if (event.target.classList.contains('pay-link')) {
                currentOrderId = event.target.dataset.orderId;
                currentAmount = event.target.dataset.totalAmount;

                document.getElementById('payment-order-id').textContent = currentOrderId;
                document.getElementById('payment-amount').textContent = currentAmount;

                paymentModal.style.display = 'block';
            }
        });

        // 关闭支付弹窗
        function closePaymentModal() {
            paymentModal.style.display = 'none';
        }

        paymentClose.addEventListener('click', closePaymentModal);
        cancelPayment.addEventListener('click', closePaymentModal);

        // 确认支付
        confirmPayment.addEventListener('click', function() {
            if (!currentOrderId || !currentAmount) {
                alert('支付信息不完整');
                return;
            }

            initiatePayment(currentOrderId, currentAmount);
            closePaymentModal();
        });

        // 点击弹窗外部关闭
        window.addEventListener('click', function(event) {
            if (event.target === paymentModal) {
                closePaymentModal();
            }
        });
    });

    // 发起支付请求
    function initiatePayment(orderId, totalAmount) {
        console.log('发起支付，订单ID:', orderId, '金额:', totalAmount);

        const paymentRequest = {
            orderId: orderId,
            totalAmount: totalAmount,
            subject: '荔枝批发订单-' + orderId
        };

        fetch('/payment/create', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(paymentRequest)
        })
        .then(response => {
            console.log('响应状态:', response.status, response.statusText);
            if (!response.ok) {
                throw new Error(`HTTP错误: ${response.status}`);
            }
            return response.text();
        })
        .then(htmlContent => {
            console.log('收到支付表单响应, 长度:', htmlContent.length);

            if (htmlContent.includes('alert(') || htmlContent.includes('错误')) {
                // 显示错误信息
                alert('支付请求失败，请查看控制台信息');
                console.error('支付错误:', htmlContent);
            } else if (htmlContent.includes('punchout_form') || htmlContent.includes('alipay')) {
                console.log('检测到支付宝支付表单，在新窗口打开');

                // 在新标签页打开支付页面
                const newWindow = window.open('', '_blank');

                // 写入支付宝支付表单
                newWindow.document.write(htmlContent);
                newWindow.document.close();

                // 自动提交表单（支付宝要求）
                setTimeout(() => {
                    const form = newWindow.document.querySelector('form');
                    if (form) {
                        form.submit();
                    } else {
                        console.error('未找到支付表单');
                        alert('支付表单加载失败，请重试');
                    }
                }, 100);

            } else {
                console.error('未知响应类型:', htmlContent.substring(0, 200));
                alert('支付请求返回未知格式，请查看控制台');
            }
        })
        .catch(error => {
            console.error('支付请求异常:', error);
            alert('支付请求失败: ' + error.message);
        });
    }
</script>
</body>
</html>
