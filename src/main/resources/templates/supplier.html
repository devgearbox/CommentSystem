<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Suppliers List</title>
    <link rel="stylesheet" th:href="@{/css/supplier.css}">
</head>
<body>
<div class="section">
    <div class="header">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="搜索供应商...">
            <button id="search-button">搜索</button>
        </div>
        <button class="view-all" id="search-all">查看全部</button>
        <button class="view-all" id="add-supplier">添加供应商</button>
        <!-- 修改：添加按钮容器 -->
        <div class="delete-controls">
            <button class="view-del" id="del-supplier">删除供应商</button>
            <button class="view-all" id="confirm-delete" style="display: none;">确认</button>
        </div>
    </div>
    <table>
        <thead>
        <tr>
            <th style="display: none">
                <input type="checkbox" id="select-all">
            </th>
            <th>ID</th>
            <th>供应商名称</th>
            <th>联系人</th>
            <th>联系电话</th>
            <th>地址</th>
            <th>供应品种</th>
            <th>加盟日期</th>
            <th>状态</th>
            <th>创建日期</th>
            <th>更新日期</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="supplier-table-body">
        <tr th:each="supplier : ${suppliers}">
            <td style="display: none">
                <input type="checkbox" class="supplier-check" th:data-id="${supplier.supplier_id}">
            </td>
            <td th:text="${supplier.supplier_id}"></td>
            <td th:text="${supplier.supplier_name}"></td>
            <td th:text="${supplier.contact}"></td>
            <td th:text="${supplier.phone}"></td>
            <td th:text="${supplier.address}"></td>
            <td th:text="${supplier.varieties}"></td>
            <td th:text="${supplier.cooperation_start_date}"></td>
            <td th:text="${supplier.status}"></td>
            <td th:text="${#temporals.format(supplier.create_time, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td th:text="${#temporals.format(supplier.update_time, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td>
                <button class="action-btn"><i class="fas fa-edit"></i> 编辑</button>
                <button class="action-btn"><i class="fas fa-eye"></i> 查看</button>
            </td>
        </tr>
        </tbody>
    </table>
<!--    添加供应商框-->
    <div id="add-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <form id="add-form">
                <div class="form-group">
                    <label>供应商名称：</label>
                    <input type="text" name="supplier_name" required>
                </div>
                <div class="form-group">
                    <label>联系人：</label>
                    <input type="text" name="contact" required>
                </div>
                <div class="form-group">
                    <label>联系电话：</label>
                    <input type="text" name="phone" required>
                </div>
                <div class="form-group">
                    <label>地址：</label>
                    <input type="text" name="address">
                </div>
                <div class="form-group">
                    <label>供应品种：</label>
                    <input type="text" name="varieties">
                </div>
                <div class="form-group">
                    <label>合作开始日期：</label>
                    <input type="text" name="cooperation_start_date">
                </div>
                <div class="form-group submit-group">
                    <button type="submit" class="submit-btn">提交</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script th:src="@{/js/supplier.js}"></script>
</body>
</html>
