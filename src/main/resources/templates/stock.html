<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>入库管理</title>
  <link rel="stylesheet" th:href="@{/css/supplier.css}"> <!-- 复用样式表 -->
</head>
  <body>
    <div class="section">
      <div class="card-header">
        <h2>入库管理</h2>
      </div>

      <table>
        <thead>
        <tr>
          <th style="display: none">
            <input type="checkbox" id="select-all-stock">
          </th>
          <th>订单编号</th>
          <th>入库品种</th>
          <th>重量(斤)</th>
          <th>经办人</th>
          <th>入库单创建时间</th>
          <th>入库时间</th>
          <th>状态</th>
          <th><div class="action-header" th:if="${session.currentUser.role != 3}">操作</div></th>
        </tr>
        </thead>
        <tbody id="stock-table-body">
        <tr th:each="stock : ${stockRecords}">
          <td style="display: none">
            <input type="checkbox" class="stock-check" th:data-id="${stock.stock_id}">
          </td>
          <td th:text="${stock.orderNo}"></td>
          <td th:text="${stock.litchi_variety}"></td>
          <td th:text="${stock.quantity}"></td>
          <td th:text="${stock.operator_name}"></td>
          <td th:text="${stock.create_time}"></td>
          <td th:text="${stock.update_time}"></td>
          <td th:text="${stock.stock_in_status.label}"></td>
          <td>
            <button class="status-btn" th:data-id="${stock.stock_id}" th:data-status="${stock.stock_in_status}" th:if="${session.currentUser.role != 3}">修改状态</button>
          </td>
        </tr>
        </tbody>
      </table>
<!--      分页功能-->
      <div class="pagination-container">
        <div class="pagination-info">
          共 <span th:text="${totalItems}">0</span> 条记录，
          第 <span th:text="${currentPage}">1</span> 页 / 共 <span th:text="${totalPages}">1</span> 页
        </div>

        <div class="pagination-controls">
          <!-- 首页 -->
          <button th:if="${currentPage > 1}"
                  onclick="goToPage(1)"
                  class="page-btn first-page">首页</button>

          <!-- 上一页 -->
          <button th:if="${currentPage > 1}"
                  onclick="goToPage([[${currentPage - 1}]])"
                  class="page-btn prev-page">上一页</button>

          <!-- 页码 -->
          <span th:each="page : ${#numbers.sequence(1, totalPages)}">
            <button th:if="${(page >= currentPage - 2) and (page <= currentPage + 2)}"
                    th:classappend="${page == currentPage} ? 'active' : ''"
                    onclick="goToPage([[${page}]])"
                    class="page-btn">
                [[${page}]]
            </button>
        </span>

          <!-- 下一页 -->
          <button th:if="${currentPage < totalPages}"
                  onclick="goToPage([[${currentPage + 1}]])"
                  class="page-btn next-page">下一页</button>

          <!-- 末页 -->
          <button th:if="${currentPage < totalPages}"
                  onclick="goToPage([[${totalPages}]])"
                  class="page-btn last-page">末页</button>

          <!-- 页面大小选择 -->
          <select onchange="changePageSize(this.value)" class="page-size-select">
            <option value="5" th:selected="${pageSize == 5}">5条/页</option>
            <option value="10" th:selected="${pageSize == 10}">10条/页</option>
            <option value="20" th:selected="${pageSize == 20}">20条/页</option>
            <option value="50" th:selected="${pageSize == 50}">50条/页</option>
          </select>
        </div>
      </div>

      <!-- 状态修改弹窗（与订单复用结构） -->
      <div id="status-modal" class="modal">
        <div class="modal-content">
          <!-- 补充 .close 类，确保关闭按钮样式 -->
          <span class="close status-close">&times;</span>
          <h2>修改状态</h2>

          <form id="status-form">
            <input type="hidden" id="status-stock-id">
            <input type="hidden" id="status-order-no">
            <!-- 补充采购订单同款结构 -->
            <div class="form-group-status">
              <label>当前状态：</label>
              <span id="current-status" class="current-status-text"></span>
            </div>
            <div class="form-group-status">
              <label>修改为：</label>
              <select id="new-status" class="status-select" required>
              </select>
            </div>
            <div id="rejection-reason-group" class="form-group-status" style="display: none;">
              <label for="rejection-reason">拒收原因：</label>
              <textarea id="rejection-reason" class="reason-textarea" placeholder="请输入拒收原因..." rows="3"></textarea>
            </div>
            <div class="form-group submit-group">
              <button type="submit" class="submit-btn">确认修改</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- 前端交互逻辑（仿照订单，动态渲染状态） -->
    <script>
      const STATUS_FLOW = [
        { value: 'pending', label: '待入库' },
        { value: 'checking', label: '验收中' },
        { value: 'completed', label: '已入库' },
        { value: 'rejected', label: '拒收' }
      ];

      function renderStatusOptions(currentStatus) {
        const select = document.getElementById('new-status');
        select.innerHTML = '';

        const currentIndex = STATUS_FLOW.findIndex(item => item.value === currentStatus);
        STATUS_FLOW.forEach((item, index) => {
          if (index >= currentIndex) {
            const option = document.createElement('option');
            option.value = item.value;
            option.textContent = item.label;
            if (item.value === currentStatus) option.selected = true;
            select.appendChild(option);
          }
        });
      }

      // 显示/隐藏拒收原因输入框
      function toggleRejectionReason(selectedStatus) {
        const reasonGroup = document.getElementById('rejection-reason-group');
        const reasonInput = document.getElementById('rejection-reason');

        if (selectedStatus === 'rejected') {
          reasonGroup.style.display = 'block';
          reasonInput.required = true;
        } else {
          reasonGroup.style.display = 'none';
          reasonInput.required = false;
          reasonInput.value = ''; // 清空输入
        }
      }

      // 绑定按钮点击事件
      document.querySelectorAll('.status-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const stockId = this.getAttribute('data-id');
          const currentStatus = this.getAttribute('data-status');
          const orderNo = this.closest('tr').querySelector('td:nth-child(2)').textContent;

          renderStatusOptions(currentStatus);
          document.getElementById('status-modal').style.display = 'block';
          document.getElementById('status-stock-id').value = stockId;
          document.getElementById('status-order-no').value = orderNo;
          document.getElementById('current-status').textContent =
            STATUS_FLOW.find(item => item.value === currentStatus)?.label || currentStatus;

          // 初始化拒收原因输入框状态
          toggleRejectionReason(currentStatus);
        });
      });

      // 监听状态选择变化
      document.getElementById('new-status').addEventListener('change', function() {
        toggleRejectionReason(this.value);
      });

      // 表单提交（调用入库单状态修改接口）
      document.getElementById('status-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const stockId = document.getElementById('status-stock-id').value;
        const orderNo = document.getElementById('status-order-no').value;
        const newStatus = document.getElementById('new-status').value;
        const rejectionReason = document.getElementById('rejection-reason').value;

        // 如果是拒收状态，必须填写原因
        if (newStatus === 'rejected' && !rejectionReason.trim()) {
          alert('请填写拒收原因');
          return;
        }

        // 构建请求数据
        const requestData = {
          stockId: parseInt(stockId),
          newStatus: newStatus,
          rejectionReason: newStatus === 'rejected' ? rejectionReason.trim() : null
        };

        fetch(`/api/stock/${stockId}/status`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(requestData)
        })
        .then(response => {
          if (!response.ok) {
            return response.json().then(errData => {
              throw new Error(errData.message || '修改失败');
            });
          }
          return response.json();
        })
        .then(data => {
          location.reload();
          alert('修改成功！');
        })
        .catch(error => {
          console.error('请求失败：', error);
          alert('修改失败，请联系对应供应商申请售后');
        });
      });

      // 关闭弹窗
      document.querySelector('.status-close').addEventListener('click', function() {
        document.getElementById('status-modal').style.display = 'none';
      });

      // 点击模态框外部关闭
      window.addEventListener('click', function(e) {
        if (e.target === document.getElementById('status-modal')) {
          document.getElementById('status-modal').style.display = 'none';
        }
      });

      // 分页功能
function goToPage(page) {
    const urlParams = new URLSearchParams(window.location.search);
    urlParams.set('page', page);
    window.location.href = window.location.pathname + '?' + urlParams.toString();
}

function changePageSize(size) {
    const urlParams = new URLSearchParams(window.location.search);
    urlParams.set('size', size);
    urlParams.set('page', '1'); // 重置到第一页
    window.location.href = window.location.pathname + '?' + urlParams.toString();
}
    </script>
  </body>
</html>
