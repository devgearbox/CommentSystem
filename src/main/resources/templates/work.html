<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>采购工作台</title>
    <style>
        /* 只保留内容区域的样式，侧边栏样式已在主页面 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .user-info {
            display: flex;
            align-items: center;
        }

        .user-info img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .stat-card .title {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #2d8659;
        }

        .stat-card .trend {
            margin-top: 10px;
            font-size: 13px;
        }

        .trend.up {
            color: #28a745;
        }

        .trend.down {
            color: #dc3545;
        }

        .section {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 20px;
            margin-bottom: 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h2 {
            font-size: 18px;
            color: #333;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background-color: #2d8659;
            color: white;
        }

        .btn-primary:hover {
            background-color: #236b45;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f9faf9;
            font-weight: bold;
            color: #555;
        }

        .status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background-color: #d4edda;
            color: #155724;
        }

        .status-rejected {
            background-color: #f8d7da;
            color: #721c24;
        }

        .action-btn {
            color: #2d8659;
            background: none;
            border: none;
            cursor: pointer;
            margin-right: 10px;
        }
    </style>
</head>
<body>
<div class="header">
    <h2>采购人员工作台</h2>
    <div class="user-info">
        <img th:src="@{/img/defaultMan.png}" alt="用户头像">
        <div>
            <div th:text="${session.username}" style="font-size: 30px"></div>
            <div style="font-size: 12px; color: #666; text-align: center;">采购专员</div>
        </div>
    </div>
</div>

<div class="stats-container">
    <div class="stat-card">
        <div class="title">待审批订单</div>
        <div class="value">5</div>
        <div class="trend up">
            <i class="fas fa-arrow-up"></i> 较昨日 +2
        </div>
    </div>
    <div class="stat-card">
        <div class="title">今日新增订单</div>
        <div class="value">3</div>
        <div class="trend down">
            <i class="fas fa-arrow-down"></i> 较昨日 -1
        </div>
    </div>
    <div class="stat-card">
        <div class="title">本月采购总量(kg)</div>
        <div class="value">1250</div>
        <div class="trend up">
            <i class="fas fa-arrow-up"></i> 较上月 +320
        </div>
    </div>
    <div class="stat-card">
        <div class="title">活跃供应商</div>
        <div class="value">8</div>
        <div class="trend">与昨日持平</div>
    </div>
</div>

<div class="section">
    <div class="section-header">
        <h2>最近采购订单</h2>
        <button class="btn btn-primary" id="createOrderBtn">
            <i class="fas fa-plus"></i> 新增采购订单
        </button>
    </div>
    <table>
        <thead>
        <tr>
            <th>订单编号</th>
            <th>供应商</th>
            <th>荔枝品种</th>
            <th>数量(kg)</th>
            <th>单价(元/kg)</th>
            <th>状态</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${recentOrders}">
            <td th:text="${order.orderId}">CG2023061501</td>
            <td th:text="${order.supplier}">海南荔枝种植基地</td>
            <td th:text="${order.variety}">妃子笑</td>
            <td th:text="${order.quantity}">300</td>
            <td th:text="${order.price}">18.5</td>
            <td>
                    <span class="status" th:classappend="${order.status} == '已审批' ? 'status-approved' :
                                      (${order.status} == '待审批' ? 'status-pending' : 'status-rejected')"
                          th:text="${order.status}">已审批</span>
            </td>
            <td>
                <button class="action-btn"><i class="fas fa-edit"></i> 编辑</button>
                <button class="action-btn"><i class="fas fa-eye"></i> 查看</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="section">
    <div class="section-header">
        <h2>常用供应商</h2>
        <button class="btn btn-primary">
            <i class="fas fa-list">查看全部</i>
        </button>
    </div>
    <table>
        <thead>
        <tr>
            <th>供应商名称</th>
            <th>联系人</th>
            <th>联系电话</th>
            <th>供应品种</th>
            <th>最近合作日期</th>
            <th>操作</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="supplier : ${suppliers}">
            <td th:text="${supplier.supplier_name}"></td>
            <td th:text="${supplier.contact}"></td>
            <td th:text="${supplier.phone}"></td>
            <td th:text="${supplier.varieties}"></td>
            <td th:text="${supplier.cooperation_start_date}"></td>
            <td>
                <button class="action-btn"><i class="fas fa-edit"></i> 编辑</button>
                <button class="action-btn"><i class="fas fa-eye"></i> 查看</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
