<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
    <!-- 内联 CSS 样式 -->
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 表单容器 */
        .register-container {
            background: #fff;
            width: 400px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .register-container h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #333;
            font-size: 24px;
        }

        /* 表单组 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #409eff; /* 聚焦时高亮 */
        }

        /* 按钮样式 */
        .btn-register {
            width: 100%;
            padding: 12px 0;
            background: #409eff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .btn-register:hover {
            background: #66b1ff;
        }

        /* 登录链接 */
        .login-link {
            text-align: center;
            margin-top: 16px;
            color: #999;
        }

        .login-link a {
            color: #409eff;
            text-decoration: none;
            margin-left: 4px;
        }
    </style>
</head>
<body>
<div class="register-container">
    <h2>用户注册</h2>
    <!-- 显示注册失败提示 -->
    <p th:if="${error}" style="color: red; text-align: center;" th:text="${error}"></p>
    <!-- 显示注册成功提示（跳转前临时显示） -->
    <p th:if="${message}" style="color: green; text-align: center;" th:text="${message}"></p>

    <!-- 表单提交到 /register -->
    <form method="post" action="/register">
        <div class="form-group">
            <label>用户名：</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>密码：</label>
            <input type="password" name="password" required>
        </div>
        <div class="form-group">
            <label>真实姓名：</label>
            <input type="text" name="real_name" required>
        </div>
        <button type="submit" class="btn-register">注册</button>
    </form>

    <!-- 跳转到登录页 -->
    <div class="login-link">
        已有账号？<a href="/templates/login">立即登录</a>
    </div>
</div>
</body>
</html>
