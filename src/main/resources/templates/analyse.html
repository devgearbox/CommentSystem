<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>采购统计分析</title>
  <!-- 引入 Bootstrap CSS -->
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <!-- 引入 Font Awesome CSS -->
  <link rel="stylesheet" th:href="@{/css/font-awesome/font-awesome.min.css}">
  <style>
    body {
      background-color: #f8f9fa;
      padding: 20px;
    }

    .page-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .card {
      border: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .stat-box {
      padding: 20px;
    }

    .stat-title {
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }

    .chart-nav {
      margin-bottom: 10px;
    }

    .chart-container {
      height: 300px;
    }

    /* 双图表行布局 */
    .chart-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .chart-col {
      flex: 1;
      min-width: 300px;
    }
  </style>
</head>

<body>
<div class="container">
  <!-- 标题及导出按钮区域 -->
  <div class="page-title">
    <h2>采购统计分析</h2>
  </div>

  <!-- 关键指标区域 -->
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4 mb-4">
    <div class="col">
      <div class="card stat-box">
        <div class="stat-title">采购订单数</div>
        <div class="stat-value" th:text="${totalOrderCount}">1,284</div>
        <p th:utext="${orderGrowthHtml}" class="mb-0"></p>
      </div>
    </div>
    <div class="col">
      <div class="card stat-box">
        <div class="stat-title">采购金额</div>
        <!-- 总采购金额：元 → 万元 -->
        <div class="stat-value" id="totalAmount"
             th:text="${totalPurchaseAmountYuan == null ? '0.00 万元' : #numbers.formatDecimal(totalPurchaseAmountYuan / 10000, 2, 2) + ' 万元'}">暂无数据</div>
        <!-- 动态渲染“较上月”增长率 -->
        <p th:utext="${amountGrowthHtml}" class="mb-0"></p>
      </div>
    </div>
    <div class="col">
      <div class="card stat-box">
        <div class="stat-title">平均订单金额</div>
        <!-- 平均订单金额：元 → 万元 -->
        <div class="stat-value" id="averageAmount"
             th:text="${averageOrderAmountYuan == null ? '0.00 万元' : #numbers.formatDecimal(averageOrderAmountYuan / 10000, 1, 2) + ' 万元'}">暂无数据</div>
        <!-- 动态渲染“较上月”增长率 -->
        <p th:utext="${avgAmountGrowthHtml}" class="mb-0"></p>
      </div>
    </div>
    <div class="col">
      <div class="card stat-box">
        <div class="stat-title">已完成订单占比</div>
        <div class="stat-value" th:text="${completedOrderRatio}">87.3%</div>
        <p th:utext="${ratioGrowthHtml}" class="mb-0"></p>
      </div>
    </div>
  </div>

  <!-- 采购金额趋势图表区域 -->
  <div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">采购金额趋势</h5>
      <div class="chart-nav">
        <button class="btn btn-primary btn-sm" data-time-unit="week" id="trend-week">周</button>
        <button class="btn btn-primary btn-sm" data-time-unit="month" id="trend-month">月</button>
        <button class="btn btn-primary btn-sm" data-time-unit="year" id="trend-year">年</button>
      </div>
    </div>
    <div class="card-body">
      <div class="chart-container">
        <canvas id="purchaseTrendChart"></canvas>
      </div>
    </div>
  </div>

  <!-- 新增“按品种采购分布”和“供应商采购占比”双图表区域 -->
  <div class="card mb-4">
    <div class="card-header">
      <h5 class="mb-0">采购分布分析</h5>
    </div>
    <div class="card-body chart-row">
      <!-- 按品种采购分布柱状图 -->
      <div class="chart-col">
        <div class="mb-3">
          <h6>按品种采购分布</h6>
        </div>
        <div class="chart-container">
          <canvas id="varietyDistributionChart"></canvas>
        </div>
      </div>
      <!-- 供应商采购占比饼图 -->
      <div class="chart-col">
        <div class="mb-3">
          <h6>供应商采购占比</h6>
        </div>
        <div class="chart-container">
          <canvas id="supplierDistributionChart"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 引入 Bootstrap JS 和 Chart.js -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/Chart.min.js}"></script>
<script th:inline="javascript">
// 金额单位转换函数（元 → 万元，保留2位小数）
function formatToTenThousandYuan(amount) {
return isNaN(amount) || amount === 0 ? '0.00' : (amount / 10000).toFixed(2);
}

// 全局存储图表实例，用于销毁旧实例
const chartInstances = {};

document.addEventListener('DOMContentLoaded', function () {
// -------------------------- 1. 采购金额趋势图（周/月/年） --------------------------
const trendCtx = document.getElementById('purchaseTrendChart').getContext('2d');
initTrendChart();

// -------------------------- 2. 按品种采购分布（柱状图） --------------------------
const varietyCtx = document.getElementById('varietyDistributionChart').getContext('2d');
renderVarietyDistributionChart(varietyCtx);

// -------------------------- 3. 供应商采购占比（饼图） --------------------------
const supplierCtx = document.getElementById('supplierDistributionChart').getContext('2d');
renderSupplierRatioChart(supplierCtx);

// -------------------------- 4. 时间单位切换事件（周/月/年） --------------------------
document.querySelectorAll('[id^="trend-"]').forEach(btn => {
btn.addEventListener('click', function () {
// 销毁旧的趋势图实例
if (chartInstances['trendChart']) {
  chartInstances['trendChart'].destroy();
}
// 重新初始化趋势图（根据时间单位）
initTrendChart(this.id.split('-')[1]);
});
});
});

// ============= 采购金额趋势图相关函数 =============
function initTrendChart(timeUnit = 'week') {
const now = new Date();
let start, end;

// 计算时间范围
if (timeUnit === 'week') {
const dayOfWeek = now.getDay() || 7; // 0=周日→7
start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek + 1);
end = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek + 7, 23, 59, 59);
} else if (timeUnit === 'month') {
start = new Date(now.getFullYear(), now.getMonth(), 1);
end = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
} else if (timeUnit === 'year') {
start = new Date(now.getFullYear(), 0, 1);
end = new Date(now.getFullYear(), 11, 31, 23, 59, 59);
}

// 调用接口获取数据并渲染
fetchTrendData(timeUnit, start, end);
}

async function fetchTrendData(timeUnit, start, end) {
try {
const params = new URLSearchParams({ timeUnit });
if (start) params.append('start', start.toISOString());
if (end) params.append('end', end.toISOString());

const response = await fetch(`/api/purchase/statistics?${params}`);
if (!response.ok) throw new Error('数据获取失败');

const result = await response.json();
renderTrendChart(result.trendData, timeUnit);
} catch (error) {
console.error('趋势数据加载失败:', error);
document.getElementById('purchaseTrendChart').parentNode.innerHTML =
'<div class="text-danger text-center py-3">数据加载失败，请重试</div>';
}
}

function renderTrendChart(rawData, timeUnit) {
const ctx = document.getElementById('purchaseTrendChart').getContext('2d');
if (chartInstances['trendChart']) {
chartInstances['trendChart'].destroy();
}

let labels = [];
let amounts = [];

if (timeUnit === 'week') {
labels = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
const weeklyData = Array(7).fill(null).map(() => ({ total: 0, days: 0 }));

rawData.forEach(item => {
const date = new Date(item.time);
let dayOfWeek = date.getDay();
dayOfWeek = dayOfWeek === 0 ? 6 : dayOfWeek - 1;

weeklyData[dayOfWeek].total += parseFloat(item.amount);
weeklyData[dayOfWeek].days += 1;
});

amounts = weeklyData.map(item =>
item.days === 0 ? 0 : (item.total / item.days).toFixed(2)
);
} else if (timeUnit === 'month') {
const monthlyWeeks = Array(4).fill(null).map(() => ({ total: 0, days: 0 }));
rawData.forEach(item => {
const dayOfMonth = new Date(item.time).getDate();
const weekIndex = Math.min(Math.floor((dayOfMonth - 1) / 7), 3);

monthlyWeeks[weekIndex].total += parseFloat(item.amount);
monthlyWeeks[weekIndex].days += 1;
});

const filteredData = monthlyWeeks.filter(item => item.days > 0);
labels = filteredData.map((_, i) => `第${i + 1}周`);
amounts = filteredData.map(item => (item.total / item.days).toFixed(2));

if (amounts.length === 0) {
document.getElementById('purchaseTrendChart').parentNode.innerHTML =
  '<div class="text-muted text-center py-3">本月无采购数据</div>';
return;
}
} else if (timeUnit === 'year') {
        const monthlyData = Array(12).fill(null).map(() => ({ total: 0, count: 0 }));

        // 按月份聚合数据
        rawData.forEach(item => {
            const date = new Date(item.time);
            const month = date.getMonth(); // 0-11
            monthlyData[month].total += parseFloat(item.amount);
            monthlyData[month].count += 1;
        });

        // 每两个月合并计算平均值，显示在偶数月
        const evenMonths = [1, 3, 5, 7, 9, 11]; // 对应的偶数月显示节点：2月、4月、6月、8月、10月、12月
        labels = [];
        amounts = [];

        for (let i = 0; i < evenMonths.length; i++) {
            const currentMonth = evenMonths[i] - 1; // 转为0-based
            const prevMonth = currentMonth - 1;

            let totalAmount = 0;
            let totalCount = 0;

            // 合并当前月和前一月的数据
            if (prevMonth >= 0) {
                totalAmount += monthlyData[prevMonth].total;
                totalCount += monthlyData[prevMonth].count;
            }

            totalAmount += monthlyData[currentMonth].total;
            totalCount += monthlyData[currentMonth].count;

            // 计算两个月合并的平均值
            const averageAmount = totalCount > 0 ? (totalAmount / totalCount) : 0;

            labels.push(`${evenMonths[i] + 1}月`); // 显示在偶数月节点上（2月、4月...12月）
            amounts.push(averageAmount.toFixed(2));
        }
    }

// 渲染新图表
const newChart = new Chart(ctx, {
type: 'line',
data: {
labels: labels,
datasets: [
  {
    label: timeUnit === 'year' ? '月均采购金额（万元）' :
      timeUnit === 'month' ? '周均采购金额（万元）' : '日均采购金额（万元）',
    data: amounts,
    borderColor: timeUnit === 'week' ? '#28a745' :
      timeUnit === 'month' ? '#20c997' : '#66b1ff',
    backgroundColor: timeUnit === 'week' ? 'rgba(40, 167, 69, 0.1)' :
      timeUnit === 'month' ? 'rgba(32, 201, 151, 0.1)' : 'rgba(102, 177, 255, 0.1)',
    tension: 0.3,
    fill: true,
    pointRadius: 4,
    pointHoverRadius: 6
  }
]
},
options: {
responsive: true,
maintainAspectRatio: false,
scales: {
  y: {
    beginAtZero: true,
    ticks: { callback: val => `${val} 万` }
  }
},
plugins: {
  tooltip: {
    callbacks: {
      label: ctx => {
                            let unitText = '';
                            if (timeUnit === 'week') unitText = '日均金额';
                            else if (timeUnit === 'month') unitText = '周均金额';
                            else if (timeUnit === 'year') unitText = '双月均金额';
        return `${unit}金额: ${ctx.raw} 万元`;
      }
    }
  }
}
}
});

// 存储新实例
chartInstances['trendChart'] = newChart;
}

// ============= 按品种采购分布（柱状图）相关函数 =============
function renderVarietyDistributionChart(ctx) {
// 从 Thymeleaf 获取数据（如果用 th:inline）
const varietyDistribution = /*[[${varietyDistribution}]]*/ {};

// 销毁旧实例（若存在）
if (chartInstances['varietyChart']) {
chartInstances['varietyChart'].destroy();
}

const newChart = new Chart(ctx, {
type: 'bar',
data: {
labels: Object.keys(varietyDistribution),
datasets: [
  {
    label: '采购数量(斤)',
    data: Object.values(varietyDistribution),
    backgroundColor: '#28a745',
    borderWidth: 1
  }
]
},
options: {
responsive: true,
maintainAspectRatio: false,
scales: {
  y: { beginAtZero: true }
}
}
});

chartInstances['varietyChart'] = newChart;
}

// ============= 供应商采购占比（饼图）相关函数 =============
function renderSupplierRatioChart(ctx) {
// 从 Thymeleaf 获取数据（如果用 th:inline）
const supplierRatio = /*[[${supplierRatio}]]*/ {};

// 销毁旧实例（若存在）
if (chartInstances['supplierChart']) {
chartInstances['supplierChart'].destroy();
}

const newChart = new Chart(ctx, {
type: 'pie',
data: {
labels: Object.keys(supplierRatio),
datasets: [
  {
    data: Object.values(supplierRatio),
    backgroundColor: ['#28a745', '#20c997', '#66b1ff', '#adb5bd']
  }
]
},
options: {
responsive: true,
maintainAspectRatio: false
}
});

chartInstances['supplierChart'] = newChart;
}
</script>
</body>
</html>
