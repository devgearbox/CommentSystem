<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>采购统计分析</title>
  <!-- 引入 Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 引入 Font Awesome CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <style>
    body {
      background-color: #f8f9fa;
      padding: 20px;
    }

    .page-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .card {
      border: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .stat-box {
      padding: 20px;
    }

    .stat-title {
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }

    .chart-nav {
      margin-bottom: 10px;
    }

    .chart-container {
      height: 300px;
    }

    /* 双图表行布局 */
    .chart-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .chart-col {
      flex: 1;
      min-width: 300px;
    }
  </style>
</head>

<body>
<div class="container">
  <!-- 标题及导出按钮区域 -->
  <div class="page-title">
    <h2>采购统计分析</h2>
    <button id="export-btn" class="btn btn-success">
      <i class="fa fa-download"></i> 导出报表
    </button>
  </div>

  <!-- 筛选区域 -->
  <div class="row align-items-center mb-4">
    <div class="col-auto">
      <select id="period-select" class="form-select">
        <option value="month">本月</option>
        <option value="quarter">本季度</option>
        <option value="year">本年</option>
        <option value="custom">自定义</option>
      </select>
    </div>
    <div class="col-auto" style="display: none;" id="date-range">
      <input type="date" id="start-date" class="form-control me-2">
      <input type="date" id="end-date" class="form-control">
    </div>
    <div class="col-auto">
      <button id="filter-btn" class="btn btn-success">
        <i class="fa fa-filter"></i> 筛选
      </button>
    </div>
  </div>

  <!-- 关键指标区域 -->
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4 mb-4">
    <div class="col">
      <div class="card stat-box">
        <div class="stat-title">总采购订单数</div>
        <div class="stat-value" th:text="${totalOrderCount}">1,284</div>
        <p class="text-success mb-0"><i class="fa fa-arrow-up"></i> 12.5% 较上月</p>
      </div>
    </div>
    <div class="col">
      <div class="card stat-box">
        <div class="stat-title">总采购金额</div>
        <!-- 总采购金额：元 → 万元 -->
        <div class="stat-value" id="totalAmount">32.08 万元</div>
        <p class="text-success mb-0"><i class="fa fa-arrow-up"></i> 8.2% 较上月</p>
      </div>
    </div>
    <div class="col">
      <div class="card stat-box">
        <div class="stat-title">平均订单金额</div>
        <!-- 平均订单金额：元 → 万元 -->
        <div class="stat-value" id="averageAmount">2.47 万元</div>
        <p class="text-danger mb-0"><i class="fa fa-arrow-down"></i> 2.1% 较上月</p>
      </div>
    </div>
    <div class="col">
      <div class="card stat-box">
        <div class="stat-title">已完成订单占比</div>
        <div class="stat-value" th:text="${completedOrderRatio}">87.3%</div>
        <p class="text-success mb-0"><i class="fa fa-arrow-up"></i> 3.2% 较上月</p>
      </div>
    </div>
  </div>

  <!-- 采购金额趋势图表区域 -->
  <div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">采购金额趋势</h5>
      <div class="chart-nav">
        <button class="btn btn-primary btn-sm" id="trend-week">周</button>
        <button class="btn btn-primary btn-sm" id="trend-month">月</button>
        <button class="btn btn-primary btn-sm" id="trend-year">年</button>
      </div>
    </div>
    <div class="card-body">
      <div class="chart-container">
        <canvas id="purchaseTrendChart"></canvas>
      </div>
    </div>
  </div>

  <!-- 新增“按品种采购分布”和“供应商采购占比”双图表区域 -->
  <div class="card mb-4">
    <div class="card-header">
      <h5 class="mb-0">采购分布分析</h5>
    </div>
    <div class="card-body chart-row">
      <!-- 按品种采购分布柱状图 -->
      <div class="chart-col">
        <div class="mb-3">
          <h6>按品种采购分布</h6>
        </div>
        <div class="chart-container">
          <canvas id="varietyDistributionChart"></canvas>
        </div>
      </div>
      <!-- 供应商采购占比饼图 -->
      <div class="chart-col">
        <div class="mb-3">
          <h6>供应商采购占比</h6>
        </div>
        <div class="chart-container">
          <canvas id="supplierDistributionChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- 详细数据表格区域（示例） -->
  <div class="card">
    <div class="card-header">
      <h5 class="mb-0">采购统计明细</h5>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-light">
          <tr>
            <th>日期</th>
            <th>订单数量</th>
            <th>采购金额</th>
            <th>平均单价</th>
            <th>已完成订单</th>
            <th>完成率</th>
          </tr>
          </thead>
          <tbody>
          <tr>
            <td>2025-08-01</td>
            <td>45</td>
            <td>¥13,520</td>
            <td>¥298</td>
            <td>42</td>
            <td>93.3%</td>
          </tr>
          <!-- 更多数据行 -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 引入 Bootstrap JS 和 Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script>
// 金额单位转换函数（元 → 万元，保留2位小数）
function formatToTenThousandYuan(amount) {
  if (isNaN(amount) || amount === 0) return '0.00';
  return (amount / 10000).toFixed(2);
}

document.addEventListener('DOMContentLoaded', function () {
  // 1. 总采购金额转换（元 → 万元）
  const totalAmountYuan = [[${totalPurchaseAmountYuan}]];
  document.getElementById('totalAmount').innerText =
    formatToTenThousandYuan(totalAmountYuan) + ' 万（元）';

  // 2. 平均订单金额转换（元 → 万元）
  const averageAmountYuan = [[${averageOrderAmountYuan}]];
  document.getElementById('averageAmount').innerText =
    formatToTenThousandYuan(averageAmountYuan) + ' 万（元）';

  // 2. 趋势图动态渲染（复用万元数据）
    function renderTrendChart(data) {
      const ctx = document.getElementById('purchaseTrendChart').getContext('2d');
      // 关键：销毁旧图表（若存在）
      const existingChart = Chart.getChart(ctx.canvas);
      if (existingChart) {
        existingChart.destroy();
      }

      const labels = data.map(item => item.time);
      const amounts = data.map(item => item.amount);

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '采购金额（万元）',
            data: amounts,
            borderColor: '#28a745',
            backgroundColor: 'rgba(40, 167, 69, 0.1)',
            tension: 0,
            fill: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true }
          }
        }
      });
    }

  // 3. 筛选器逻辑：调用后端接口更新趋势图
    async function fetchTrendData(timeUnit, start, end) {
      let format = '%Y-%m'; // 默认按月
      if (timeUnit === 'week') {
        format = '%Y-%u'; // 按周分组（MySQL 周格式）
      } else if (timeUnit === 'month') {
        format = '%Y-%m'; // 按月分组
      } else if (timeUnit === 'year') {
        format = '%Y'; // 按年分组
      } else if (timeUnit === 'custom') {
        format = '%Y-%m-%d'; // 自定义时间默认按天
      }

      const params = new URLSearchParams({ timeUnit, format }); // 传递 format
      if (start) params.append('start', start);
      if (end) params.append('end', end);

      const response = await fetch(`/api/purchase/statistics?${params}`);
      const result = await response.json();

      renderTrendChart(result.trendData);
    }

  // 4. 初始化趋势图（默认本月数据）
  const now = new Date();
  // 本月第一天 00:00:00
  const thisMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  // 本月最后一天 23:59:59
  const thisMonthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);

  // 转换为 ISO 格式字符串（后端 @DateTimeFormat 可识别）
  fetchTrendData(
    'month',
    thisMonthStart.toISOString(),
    thisMonthEnd.toISOString()
  );

  // 5. 绑定时间维度切换（周/月/年）
  document.querySelectorAll('[id^="trend-"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const timeUnit = btn.id.split('-')[1]; // trend-week → week
      fetchTrendData(timeUnit);
    });
  });

  // 6. 自定义时间筛选
  document.getElementById('filter-btn').addEventListener('click', () => {
    const start = document.getElementById('start-date').value;
    const end = document.getElementById('end-date').value;
    fetchTrendData('custom', start, end);
  });

  // 按品种采购分布柱状图初始化（示例数据）
  const varietyCtx = document.getElementById('varietyDistributionChart').getContext('2d');
  new Chart(varietyCtx, {
    type: 'bar',
    data: {
      labels: ['妃子笑', '桂味', '糯米糍', '槐枝', '三月红', '其他'],
      datasets: [{
        label: '采购数量(斤)',
        data: [12500, 9800, 8200, 6500, 4300, 2100],
        backgroundColor: '#28a745',
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });

  // 供应商采购占比饼图初始化（示例数据）
  const supplierCtx = document.getElementById('supplierDistributionChart').getContext('2d');
  new Chart(supplierCtx, {
    type: 'pie',
    data: {
      labels: ['岭南果业', '华南农业', '东方果园', '其他供应商'],
      datasets: [{
        data: [45, 25, 20, 10],
        backgroundColor: [
          '#28a745',
          '#20c997',
          '#66b1ff',
          '#adb5bd'
        ]
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  });

  // 趋势图表切换逻辑（示例，可扩展）
  const trendBtns = document.querySelectorAll('[id^="trend-"]');
  trendBtns.forEach(btn => {
    btn.addEventListener('click', function () {
      trendBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      // 这里可根据点击的按钮切换图表数据，如周、月、年数据
    });
  });
});
</script>
</body>
</html>
